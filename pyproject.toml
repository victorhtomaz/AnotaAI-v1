[project]
name = "anotai"
version = "0.1.0"
description = "Alinhamento temporal e recuperação documental em aulas gravadas."
requires-python = "==3.12.*"
dependencies = [
    "bm25s>=0.3.16",
    "numpy>=2.0",
    "ollama>=0.6.3",
    "pymupdf>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "whisperx>=3.8.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anotai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
default-groups = ["dev"]
